name: preflight

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r apps/api/requirements.txt pytest pip-audit
      - run: pnpm preflight
      - run: pnpm release:validate -- releases/fixtures/approved-image-video-manifest.json
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm --dir apps/video-vue typecheck
      - run: pnpm --dir apps/video-vue check:i18n
      - run: python -m pytest apps/api/tests -q
        env:
          PYTHONPATH: apps/api
      - run: pnpm build:web
      - run: pnpm audit --prod --audit-level high
      - run: pip-audit -r apps/api/requirements.txt
      - run: docker build --platform linux/amd64 -f Dockerfile.nbs-api -t incept-api:preflight .
      - run: docker build --platform linux/amd64 --build-arg INCEPT_ENABLE_GAMING_PLAYABLE=false -f Dockerfile.web -t incept-web:preflight .
