name: preflight

on:
  pull_request:
  push:
    branches: [main, toonflow-native-host]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/video-vue install --frozen-lockfile
      - run: python -m pip install -r apps/api/requirements.txt pytest pip-audit coverage
      - name: Install media runtime used by the unified API
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm preflight
      - run: pnpm release:validate -- releases/fixtures/approved-image-video-manifest.json
      - run: pnpm lint:web
      - run: pnpm typecheck:web
      - run: pnpm --dir apps/video-vue typecheck
      - run: pnpm --dir apps/video-vue check:i18n
      - run: node --test apps/video-vue/scripts/i18n-audit.test.mjs
      - run: node --experimental-strip-types --test --test-reporter=junit src/*.test.ts > /tmp/linglonglab-pi-runtime-tests.xml
        working-directory: apps/video-vue/apps/agentRuntime
      - run: python scripts/check-agent-test-report.py /tmp/linglonglab-pi-runtime-tests.xml
      - run: node --experimental-strip-types --test --test-reporter=junit $(rg --files apps/web/src -g '*.test.ts') > /tmp/linglonglab-agent-frontend-tests.xml
        working-directory: apps/video-vue
      - run: python scripts/check-agent-test-report.py /tmp/linglonglab-agent-frontend-tests.xml
      - run: python -m coverage run --source=app.video_studio.agent,app.video_studio.agent_context,app.video_studio.agent_turns,app.video_studio.pi_agent,app.video_studio.pi_tools,app.video_studio.pi_process,app.video_studio.pi_model,app.video_studio.pi_sessions,app.video_studio.pi_runs,app.video_studio.pi_http,app.video_studio.pi_business,app.video_studio.pi_capabilities,app.video_studio.native_host,app.video_studio.workspace_documents -m pytest apps/api/tests -q --junitxml=/tmp/linglonglab-agent-tests.xml
        env:
          PYTHONPATH: apps/api
      - run: python scripts/check-agent-test-report.py /tmp/linglonglab-agent-tests.xml
      - run: python -m coverage report --fail-under=80
      - run: python -m coverage report --include='*/pi_*.py,*/native_host.py,*/agent_turns.py,*/workspace_documents.py' --fail-under=80
      - run: pnpm build:web
      - run: pnpm audit --prod --audit-level high
      - run: pnpm --dir apps/video-vue audit --prod --audit-level high
      - run: pip-audit -r apps/api/requirements.txt
      - run: docker build --platform linux/amd64 -f Dockerfile.nbs-api -t incept-api:preflight .
      - name: Verify native host starts and shuts down in production image
        run: |
          docker run --rm -i incept-api:preflight python - <<'PY'
          from app.video_studio.native_host import NativeHostManager

          host = NativeHostManager()
          try:
              endpoint = host._start()
              process = host._process
              assert endpoint.pid == process.pid and process.poll() is None
              assert host._start() == endpoint, "Readiness must reuse the same private host"
          finally:
              host.shutdown()
          assert process.poll() is not None, "Shutdown must reap the native child"
          print("Production native host readiness, reuse and shutdown passed")
          PY
      - run: docker build --platform linux/amd64 --build-arg INCEPT_ENABLE_GAMING_PLAYABLE=false -f Dockerfile.web -t incept-web:preflight .
