[project]
name = "incept-api"
version = "0.1.0"
description = "FastAPI service for Incept AI Workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115.6",
  "google-auth>=2.37.0",
  "google-cloud-bigquery>=3.27.0",
  "google-genai>=1.16.0",
  "openai>=1.30.0",
  "pillow>=10.0.0",
  "python-multipart>=0.0.9",
  "rembg>=2.0.50",
  "pydantic>=2.10.3",
  "uvicorn[standard]>=0.32.1",
]

[dependency-groups]
dev = [
  "ruff>=0.8.3"
]

[tool.ruff]
line-length = 100
