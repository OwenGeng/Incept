openapi: 3.0.0
info:
  title: Store Intelligence.
  description: ''
  version: '1.0'
servers:
  - url: https://api.sensortower.com
security:
  - auth_token: []
paths:
  /v1/ios/featured/today/stories:
    get:
      tags:
        - 'FEATURED: Featured Today'
      description: |
        <p>Retrieve featured today story metadata, such as story title, label, style, and position, as well as the story's featured apps and relevant app metadata.</p> <p> <strong>Note:</strong> Non-App Performance Insights users are limited the the last 3 days of featured today stories. App Performance Insights users will be able to retrieve all-time featured today stories, including <strong>tomorrow's</strong> stories.</p>
      operationId: featured_today_stories
      summary: Fetches featured today stories.
      parameters:
        - description: |-
            Country code for the featured today stories,
            <a target='_blank' href='/api/docs/static/country_ids.json'>Country Codes</a>
          in: query
          name: country
          example: US
          schema:
            type: string
        - description: 'Start Date, `YYYY-MM-DD` (defaults to 3 days ago)'
          in: query
          name: start_date
          schema:
            type: string
            format: date
        - description: 'End Date, `YYYY-MM-DD` (defaults to today)'
          in: query
          name: end_date
          schema:
            type: string
            format: date
      responses:
        '200':
          description: <strong>Success.</strong>
        '401':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/401'
        '403':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/403'
        '422':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/422'
  /v1/ios/featured/apps:
    get:
      tags:
        - 'FEATURED: Featured Apps and Games'
      description: |
        <p>Retrieve apps featured on the App Store&#39;s Apps &amp; Games pages.</p> <p><strong>Note:</strong> Non-App Performance Insights users are limited to the last 3 days of data. App Performance Insights users will be able to retrieve all-time data.</p>
      operationId: featured_apps
      summary: Fetches featured apps and games.
      parameters:
        - description: |-
            Category ID,
            <a target='_blank' href='/api/docs/static/featured_apps_category_ids.json'>Category IDs</a>
          in: query
          name: category
          required: true
          example: '6020'
          schema:
            type: string
        - description: |-
            Country code,
            <a target='_blank' href='/api/docs/static/country_ids.json'>Country Codes</a>
          in: query
          name: country
          example: FR
          schema:
            default: US
            type: string
        - description: 'Start Date, `YYYY-MM-DD` (defaults to 3 days ago)'
          in: query
          name: start_date
          example: '2021-10-01'
          schema:
            type: string
            format: date
        - description: 'End Date, `YYYY-MM-DD` (defaults to today)'
          in: query
          name: end_date
          example: '2021-10-01'
          schema:
            type: string
            format: date
      responses:
        '200':
          description: <strong>Success.</strong>
        '401':
          description: '<strong>Invalid authentication token.</strong> <br> Generate an API authentication token on your <a target="_blank" href="https://app.sensortower.com/users/edit/api-settings">account profile (API Settings tab)</a> and ensure that your organization has access to this product. <br> Please contact the Sensor Tower team for more information.'
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                    example: Invalid authentication token.
                required:
                  - error
                type: object
        '403':
          description: '<strong>Forbidden.</strong> <br> Your API token is not valid. <br> If you lost your API token you can generate a new one on your <a target="_blank" href="https://app.sensortower.com/users/edit/api-settings">account profile (API Settings tab)</a> or contact the Sensor Tower team for more information.'
          content:
            application/json:
              schema:
                properties:
                  error:
                    type: string
                    example: Your API token is not authorized.
                required:
                  - error
                type: object
        '422':
          description: <strong>Invalid Query Parameter.</strong> <br> Please check that all required params are present and valid.
          content:
            application/json:
              schema:
                properties:
                  errors:
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          example: 'Required parameter: name is missing'
                      required:
                        - title
                    type: array
                required:
                  - errors
                type: object
  '/v1/{os}/featured/creatives':
    get:
      tags:
        - 'FEATURED: Featured App Rankings'
      description: |
        Retrieve the featured creatives and their positions within the App and Google Play store over time. <br> <strong>Note:</strong> Some Feature Types are specific to the iOS App Store.
      operationId: featured_creatives
      summary: Fetches featured creatives details of a particular app.
      parameters:
        - description: Operating System
          in: path
          name: os
          required: true
          schema:
            default: ios
            enum:
              - ios
              - android
            type: string
        - description: ID of App
          in: query
          name: app_id
          required: true
          example: '479516143'
          schema:
            type: string
        - description: |-
            Countries to return results for, separated by commas
            <br>
            <a target='_blank' href='/api/docs/static/country_ids.json'>Country Codes</a>
          in: query
          name: countries
          explode: false
          example:
            - US
          schema:
            type: array
            items:
              default: ''
              type: string
        - description: |-
            Types to return results for, separated by commas,
            <a target='_blank' href='/api/docs/static/featured_rankings_types.json'>Types</a>
          in: query
          name: types
          explode: false
          schema:
            type: array
            items:
              default: ''
              type: string
        - description: 'Start Date, `YYYY-MM-DD` (defaults to 30 days ago)'
          in: query
          name: start_date
          example: '2021-02-01'
          schema:
            type: string
            format: date
        - description: 'End Date, `YYYY-MM-DD` (defaults to today)'
          in: query
          name: end_date
          example: '2021-02-02'
          schema:
            type: string
            format: date
      responses:
        '200':
          description: <strong>Success.</strong>
          content:
            application/json:
              schema:
                type: object
                properties:
                  features:
                    type: array
                    items:
                      $ref: '#/paths/~1v1~1%7Bos%7D~1featured~1creatives/get/responses/200/content/application~1json/schema/components/schemas/FeaturedCreative'
                components:
                  schemas:
                    FeaturedCreative:
                      type: object
                      properties:
                        country_name:
                          type: string
                          example: US
                        country:
                          type: string
                          example: US
                        category:
                          oneOf:
                            - type: integer
                            - type: string
                              description: The App or Google Play Store category that the specific feature was shown in
                          example: 11
                        type:
                          type: string
                          example: story_list
                        path:
                          type: array
                          items:
                            type: string
                          description: The name of the specific feature section and name of the specific feature list/creative
                          example:
                            - Today
                            - Top Games Right Now
                        creatives:
                          type: array
                          items:
                            type: string
                            description: The url of the feature creative
                          example: []
                        first_seen_at:
                          type: string
                          example: null
                        positions:
                          type: array
                          items:
                            type: array
                            items:
                              oneOf:
                                - type: string
                                  description: The date of the specific feature
                                - type: array
                                  items:
                                    type: integer
                                    description: The ranking or position of the target app for the given feature type and date
                            example:
                              - '2021-10-11'
                              - - 21
                        store_positions:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                                example: '2021-10-11'
                                description: The date of the specific feature
                              app_position:
                                type: integer
                                example: 21
                                description: The ranking or position of the target app for the given feature type and date
                              section_position:
                                type: integer
                                description: The position in which the specific feature type is located on the App or Google Play Store on the given date. An indicator of how far a user must scroll before reaching the feature list
                                example: 2
                        downloads:
                          type: integer
                          description: The number of total downloads attributed to the specific feature for the selected time period
                          example: 32
                        downloads_share:
                          type: number
                          format: float
                          description: The percentage of total downloads from all featurings that are attributed to the specific feature
                          example: 1.75
                        feature_downloads:
                          type: array
                          items:
                            type: array
                            items:
                              oneOf:
                                - type: string
                                  description: The date of the specific feature
                                - type: integer
                                  description: The number of downloads attributed to the specific feature for the given date
                            example:
                              - '2021-10-11'
                              - 4
                        occurrences:
                          type: integer
                          description: The number of times that the target app appeared in the specific feature during the selected time period
                          example: 8
        '401':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/401'
        '403':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/403'
        '422':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/422'
  '/v1/{os}/featured/impacts':
    get:
      tags:
        - 'FEATURED: Featured App Rankings'
      description: |
        Retrieve the occurrence and download-impact data for an apps featured in the App or Google Play Store. <br> <strong>Note:</strong> Some Feature Types are specific to the iOS App Store.
      operationId: featured_impacts
      summary: Fetches occurrence and download-impact data for an app.
      parameters:
        - description: Operating System
          in: path
          name: os
          required: true
          schema:
            default: ios
            enum:
              - ios
              - android
            type: string
        - description: ID of App
          in: query
          name: app_id
          required: true
          example: '479516143'
          schema:
            type: string
        - description: |-
            Countries to return results for, separated by commas
            <br>
            <a target='_blank' href='/api/docs/static/country_ids.json'>Country Codes</a>
          in: query
          name: countries
          explode: false
          schema:
            type: array
            items:
              default: ''
              type: string
        - description: |-
            Types to return results for, separated by commas,
            <a target='_blank' href='/api/docs/static/featured_rankings_types.json'>Types</a>
          in: query
          name: types
          explode: false
          schema:
            type: array
            items:
              default: ''
              type: string
        - description: Breakdown type for the featured today stories
          in: query
          name: breakdown
          example: country
          schema:
            type: string
            enum:
              - country
              - type
        - description: 'Start Date, `YYYY-MM-DD` (defaults to 30 days ago)'
          in: query
          name: start_date
          example: '2021-02-01'
          schema:
            type: string
            format: date
        - description: 'End Date, `YYYY-MM-DD` (defaults to today)'
          in: query
          name: end_date
          example: '2021-05-01'
          schema:
            type: string
            format: date
      responses:
        '200':
          description: <strong>Success.</strong>
        '401':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/401'
        '403':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/403'
        '422':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/422'
  /v1/facets/metrics?aso_keyword_research:
    get:
      tags:
        - 'APP STORE OPTIMIZATION: Keyword Research'
      operationId: get ASOKwResearch
      description: |
        Retrieves the list of ranked apps for any keyword and provides metrics such as rank, traffic and keyword difficulty.

        ## Usage
        - **Required**:
          - `keywords`
          - `regions`
          - `os`
        - **Exactly one `bundle`**
        - **Optional**:
          - `devices` (iOS only)

        ## ASO Keyword Research Bundle
        - `aso_keyword_research` - Get metrics for a particular keyword.

        ## Metrics in ASO Keyword Research Bundle
        - `app_id` - The app ID of the ranked app for the keyword.
        - `keyword_rank` - App's current position for this keyword in store search results.
        - `keyword_traffic` - How often this keyword is searched. Higher scores mean more people search for it.
        - `keyword_difficulty_score` - How hard it is to rank highly for this keyword. Higher scores mean tougher competition.
        - `app_name` - The name of the app.
        - `app_os` - The platform of the app.
        - `publisher_id` - The publisher ID of the app.
        - `publisher_name` - The publisher name of the app.

        ## Notes

        **Important:** This API might get updated in the future (next 6 months after release, see <a href="/api/docs/changelog">API Changelog</a>) as we continue to expand its functionality and support more metrics.
        We recommend integrating with caution and monitoring release notes for upcoming changes.
      summary: Fetch detailed summary of a particular keyword
      parameters:
        - description: The bundle to retrieve data for
          in: query
          name: bundle
          required: true
          example: aso_keyword_research
          schema:
            type: string
            enum:
              - aso_keyword_research
        - description: The platform to filter by.
          in: query
          name: os
          required: true
          example: ios
          schema:
            type: string
            enum:
              - ios
              - android
        - description: A single keyword to research
          in: query
          name: keywords
          required: true
          schema:
            type: string
          example: social
        - description: 'A single region code, <a target=''_blank'' href=''/api/docs/static/country_ids.json''>Region Codes</a>'
          in: query
          name: regions
          required: true
          schema:
            type: string
          example: US
        - description: The devices to filter by (iOS only). (Default - `iphone`)
          in: query
          name: devices
          required: false
          schema:
            type: string
            enum:
              - iphone
              - ipad
      responses:
        '200':
          description: <strong>Success.</strong>
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        app_id:
                          type: string
                          format: app_id
                          description: App ID
                          example: com.facebook.katana
                        keyword_rank:
                          type: number
                          description: Keyword rank
                          example: 1
                        keyword_traffic:
                          type: number
                          description: Keyword traffic
                          example: 10
                        keyword_difficulty_score:
                          type: number
                          description: Difficulty score
                          example: 5
                      additionalProperties: true
                required:
                  - data
              examples:
                top_app_ids_example:
                  summary: Top App IDs for "facebook" keyword
                  value:
                    data:
                      - app_id: com.facebook.katana
                        app_name: Facebook
                        app_os: android
                        publisher_id: 'Meta+Platforms,+Inc.'
                        publisher_name: 'Meta Platforms, Inc.'
                        keyword_traffic: 3
                        keyword_rank: 1
                        keyword_difficulty_score: 7
                      - app_id: com.facebook.lite
                        app_name: Facebook Lite
                        app_os: android
                        publisher_id: 'Meta+Platforms,+Inc.'
                        publisher_name: 'Meta Platforms, Inc.'
                        keyword_traffic: 3
                        keyword_rank: 2
                        keyword_difficulty_score: 7
                      - app_id: com.facebook.orca
                        app_name: Messenger
                        app_os: android
                        publisher_id: 'Meta+Platforms,+Inc.'
                        publisher_name: 'Meta+Platforms,+Inc.'
                        keyword_traffic: 3
                        keyword_rank: 3
                        keyword_difficulty_score: 7
                      - app_id: com.instagram.android
                        app_name: Instagram
                        app_os: android
                        publisher_id: Instagram
                        publisher_name: Instagram
                        keyword_traffic: 3
                        keyword_rank: 4
                        keyword_difficulty_score: 7
        '401':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/401'
        '403':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/403'
        '422':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/422'
  /v1/facets/metrics?aso_timeseries:
    get:
      tags:
        - 'APP STORE OPTIMIZATION: Timeseries Metrics'
      operationId: get ASOTimeseries
      description: |
        Get timeseries metrics for ASO Keywords.

        ## Usage
        - **Required**:
          - `breakdown`
          - `date_granularity`
          - `start_date`
          - `end_date`
          - `keywords`
          - `regions`
          - `os`
          - `app_ids`
        - **Exactly one `metric`**
        - **Optional**:
          - `devices` (iOS only)
          - `paid_search_state` (iOS only)
          - `keyword_types`

        ## Breakdowns

        Comma-separated list of breakdowns.

        ### Available breakdowns

        - `date, keyword` - Timeseries data by keyword

        ## Granularity
        - `date_granularity`: How data is aggregated (day/week/month/quarter)

        ## Metrics
        - `keyword_rank` - Your app's current position for this keyword in store search results.
        - `keyword_traffic` - How often this keyword is searched. Higher scores mean more people search for it.
        - `est_keyword_downloads` - Estimated downloads driven by this keyword.
        - `keyword_opportunity_score` - Opportunity score estimates how valuable a keyword is for this app, blending Traffic Score, Difficulty, your app's relevance (metadata/semantic matches), and whether the app already ranks. Higher scores indicate higher organic potential.
        - `keyword_app_count` - Number of apps currently ranking for this keyword in the store.

        ## Notes

        **Important:** This API might get updated in the future (next 6 months after release, see <a href="/api/docs/changelog">API Changelog</a>) as we continue to expand its functionality and support more metrics.
        We recommend integrating with caution and monitoring release notes for upcoming changes.
      summary: Fetch timeseries metrics for ASO Keywords
      parameters:
        - description: The metric to retrieve data for
          in: query
          name: metric
          required: true
          example: keyword_rank
          schema:
            type: string
            enum:
              - keyword_rank
              - keyword_traffic
              - est_keyword_downloads
              - keyword_opportunity_score
              - keyword_app_count
        - description: 'How to break down the data (comma-separated for breakdown by multiple fields, e.g. `date, keyword`)'
          in: query
          name: breakdown
          required: true
          schema:
            type: string
            enum:
              - 'date, keyword'
          example: 'date, keyword'
        - description: Date granularity for the data.
          in: query
          required: true
          name: date_granularity
          example: day
          schema:
            type: string
            enum:
              - day
              - week
              - month
              - quarter
        - description: Start date for the data range. `YYYY-MM-DD` format
          in: query
          name: start_date
          required: true
          example: '2025-01-01'
          schema:
            type: string
            format: date
        - description: End date for the data range. `YYYY-MM-DD` format
          in: query
          name: end_date
          required: true
          example: '2025-01-31'
          schema:
            type: string
            format: date
        - description: 'A single region code, <a target=''_blank'' href=''/api/docs/static/country_ids.json''>Region Codes</a>'
          in: query
          name: regions
          required: true
          schema:
            type: string
          example: US
        - description: 'Array of keywords to filter by (comma-separated strings). **Maximum: 100 keywords per request.**'
          in: query
          name: keywords
          required: true
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
          example:
            - facebook
            - messenger app
        - description: Single App ID to retrieve data for. Use integer ID for iOS (e.g. `284882215`) or package name for Android (e.g. `com.facebook.katana`).
          in: query
          name: app_ids
          required: true
          schema:
            type: string
          example: '284882215'
        - description: The platform to filter by.
          in: query
          name: os
          required: true
          example: ios
          schema:
            type: string
            enum:
              - ios
              - android
        - description: The devices to filter by (iOS only). (Default - `iphone`)
          in: query
          name: devices
          required: false
          schema:
            type: string
            enum:
              - iphone
              - ipad
        - description: The paid search states to filter by (iOS only). (Default - include all states)
          in: query
          name: paid_search_state
          required: false
          example: []
          schema:
            type: array
            items:
              type: string
              enum:
                - safe
                - exposed
                - threatened
                - critical
            minItems: 0
          style: form
          explode: false
        - description: The keyword types to filter by. (Default - include all types)
          in: query
          name: keyword_types
          required: false
          example: []
          schema:
            type: array
            items:
              type: string
              enum:
                - branded
                - competitor
                - generic
            minItems: 0
          style: form
          explode: false
      responses:
        '200':
          description: <strong>Success.</strong>
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          description: Date of the data point (when breakdown includes date)
                          example: '2025-01-01'
                        keywords:
                          type: array
                          items:
                            type: string
                          minItems: 1
                          description: Keyword
                          example:
                            - game
                        keyword_rank:
                          type: number
                          description: Keyword rank
                          example: 1
                        keyword_traffic:
                          type: number
                          description: Keyword traffic
                          example: 10
                        est_keyword_downloads:
                          type: number
                          description: Estimated downloads driven by this keyword
                          example: 15000
                        keyword_opportunity_score:
                          type: number
                          description: Opportunity score
                          example: 5
                        keyword_app_count:
                          type: number
                          description: Number of apps currently ranking for this keyword
                          example: 1000
                      additionalProperties: true
                required:
                  - data
              examples:
                keyword_rank_example:
                  summary: Keyword Rank Timeseries example
                  value:
                    data:
                      - keyword: facebook
                        date: '2025-01-01'
                        keyword_rank: 1
                      - keyword: messenger app
                        date: '2025-01-01'
                        keyword_rank: 2
                      - keyword: facebook
                        date: '2025-01-02'
                        keyword_rank: 1
                      - keyword: messenger app
                        date: '2025-01-02'
                        keyword_rank: 3
        '401':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/401'
        '403':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/403'
        '422':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/422'
  /v1/facets/metrics?aso_rank_overview:
    get:
      tags:
        - 'APP STORE OPTIMIZATION: Timeseries Metrics'
      operationId: get RankOverviewTimeseries
      description: |
        Get Rank Overview timeseries metrics for ASO Keywords.

        ## Usage
        - **Required**:
          - `breakdown`
          - `date_granularity`
          - `start_date`
          - `end_date`
          - `keywords`
          - `regions`
          - `os`
          - `app_ids`
        - **Exactly one `bundle`**
        - **Optional**:
          - `devices` (iOS only)
          - `paid_search_state` (iOS only)
          - `keyword_types`

        ## Breakdowns

        Comma-separated list of breakdowns.

        ### Available breakdowns

        - `date, keyword_rank_overview_bin` - Time series data by rank overview bin

        ## Granularity
        - `date_granularity`: How data is aggregated (day/week/month/quarter)

        ## ASO Rank Overview Bundle - included metrics
        - `keyword_rank_overview_bin` - Keyword rank divisions / segments / tiers (`1`, `2-3`, `4-5`, `6-10`, `11-20`, `21+`).
        - `keyword_rank_overview_count` - The number of keywords in the rank division / segment / tier.

        ## Notes

        **Important:** This API might get updated in the future (next 6 months after release, see <a href="/api/docs/changelog">API Changelog</a>) as we continue to expand its functionality and support more metrics.
        We recommend integrating with caution and monitoring release notes for upcoming changes.
      summary: Fetch timeseries metrics for ASO Rank Overview
      parameters:
        - description: The bundle to retrieve data for
          in: query
          name: bundle
          required: true
          example: aso_rank_overview
          schema:
            type: string
            enum:
              - aso_rank_overview
