  /v1/facets/metrics?ratings:
    get:
      tags:
        - 'RATINGS & REVIEWS: Rating Analysis'
      operationId: getRatingMetrics
      description: |
        Get rating metrics for mobile apps including total count, star-level breakdowns, and averages.

        ## Bundles

        ### ratings_incremental
        Daily/periodic rating metrics for the selected period:
        - `rating_average_incremental` - Average rating score (1-5) for the period
        - `rating_count_incremental` - Total number of ratings for the period
        - `rating_1_star_count_incremental` - Count of 1 star ratings for the period
        - `rating_2_star_count_incremental` - Count of 2 star ratings for the period
        - `rating_3_star_count_incremental` - Count of 3 star ratings for the period
        - `rating_4_star_count_incremental` - Count of 4 star ratings for the period
        - `rating_5_star_count_incremental` - Count of 5 star ratings for the period

        ### ratings_cumulative
        Cumulative rating metrics at the end of the period:
        - `rating_average_cumulative` - Cumulative average rating score (1-5)
        - `rating_count_cumulative` - Total cumulative number of ratings
        - `rating_1_star_count_cumulative` - Count of 1 star ratings for the period
        - `rating_2_star_count_cumulative` - Count of 2 star ratings for the period
        - `rating_3_star_count_cumulative` - Count of 3 star ratings for the period
        - `rating_4_star_count_cumulative` - Count of 4 star ratings for the period
        - `rating_5_star_count_cumulative` - Count of 5 star ratings for the period

        ## Breakdowns

        Specify how to break down the data. Use comma-separated values for multiple breakdowns.

        ### Supported combinations

        | Breakdown | Description |
        |-----------|-------------|
        | `app_id` | Table-like breakdown by app |
        | `app_id,date` | Time series data by app |
        | `region` | Table-like breakdown by region |
        | `region,date` | Time series data by region |
        | `app_version` | Breakdown by app version (**incremental bundle only**) |

        ## Notes

        **Important:** This API might get updated in the future (next 6 months after release, see <a href="/api/docs/changelog">API Changelog</a>) as we continue to expand its functionality and support more metrics.
        We recommend integrating with caution and monitoring release notes for upcoming changes.
      summary: Fetches rating metrics for mobile apps
      parameters:
        - description: The bundle of rating metrics to retrieve
          in: query
          name: bundle
          required: true
          example: ratings_incremental
          schema:
            type: string
            enum:
              - ratings_incremental
              - ratings_cumulative
        - description: How to break down the data
          in: query
          name: breakdown
          required: true
          schema:
            type: string
            enum:
              - app_id
              - 'app_id,date'
              - region
              - 'region,date'
              - app_version
          example: 'app_id,date'
        - description: How data is aggregated (required when using date breakdown)
          in: query
          name: date_granularity
          required: false
          schema:
            type: string
            enum:
              - day
              - week
              - month
          example: week
        - description: 'App IDs to retrieve data for (comma-separated). Use integer IDs for iOS (e.g. `284882215`) or package names for Android (e.g. `com.facebook.katana`). **Maximum: 1,000 app IDs per request.**'
          in: query
          name: app_ids
          required: true
          explode: false
          schema:
            type: array
            items:
              type: string
              example: '284882215'
            default: []
            maxItems: 1000
          example:
            - '284882215'
            - '375380948'
        - description: Regions to filter by (comma-separated). <a target='_blank' href='/api/docs/static/country_ids.json'>Country Codes</a>
          in: query
          name: regions
          required: false
          explode: false
          schema:
            type: array
            items:
              type: string
              example: US
            default: []
          example:
            - US
