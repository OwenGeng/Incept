  /v1/facets/metrics?aso_top_keywords:
    get:
      tags:
        - 'APP STORE OPTIMIZATION: Top Keywords'
      operationId: get TopKeywordMetrics
      description: |
        Get top keywords metrics for an app.

        ## Usage
        - **Required**:
          - `breakdown`
          - `regions`
          - `os`
          - `app_ids`
        - **Exactly one `bundle`**
        - **Optional**:
          - `start_date`
          - `end_date`
          - `user_tracked`
          - `devices` (iOS only)
          - `keyword_types`
          - `limit`
          - `offset`
          - `order_by`

        ## Breakdowns

        Comma-separated list of breakdowns.

        ### Available breakdowns

        - `keyword` - Data per keyword

        ## ASO Top Keywords Bundle
        - `aso_top_keywords` - Get metrics for top keywords.

        ## Metrics included in bundle
        - `keyword_rank` - Your app's current position for this keyword in store search results.
        - `keyword_traffic` - How often this keyword is searched. Higher scores mean more people search for it.
        - `est_keyword_downloads` - Estimated downloads driven by this keyword.
        - `keyword_opportunity_score` - Opportunity score estimates how valuable a keyword is for this app, blending Traffic Score, Difficulty, your app's relevance (metadata/semantic matches), and whether the app already ranks. Higher scores indicate higher organic potential.
        - `keyword_app_count` - Number of apps currently ranking for this keyword in the store.
        - `keyword_type` - Type of keyword (Branded, Competitor, Generic).
        - `keyword_density` - Density of specific keyword in description.

        ## Notes

        **Important:** This API might get updated in the future (next 6 months after release, see <a href="/api/docs/changelog">API Changelog</a>) as we continue to expand its functionality and support more metrics.
        We recommend integrating with caution and monitoring release notes for upcoming changes.
      summary: Fetch top keywords metrics for an app
      parameters:
        - description: The bundle to retrieve data for
          in: query
          name: bundle
          required: true
          example: aso_top_keywords
          schema:
            type: string
            enum:
              - aso_top_keywords
        - description: 'How to break down the data (comma-separated for breakdown by multiple fields, e.g. `keyword`)'
          in: query
          name: breakdown
          required: true
          schema:
            type: string
            enum:
              - keyword
          example: keyword
        - description: 'A single region code, <a target=''_blank'' href=''/api/docs/static/country_ids.json''>Region Codes</a>'
          in: query
          name: regions
          required: true
          schema:
            type: string
          example: US
        - description: Single App ID to retrieve data for. Use integer ID for iOS (e.g. `284882215`) or package name for Android (e.g. `com.facebook.katana`).
          in: query
          name: app_ids
          required: true
          schema:
            type: string
          example: '284882215'
        - description: The platform to filter by.
          in: query
          name: os
          required: true
          example: ios
          schema:
            type: string
            enum:
              - ios
              - android
        - description: 'Start date for the data range. `YYYY-MM-DD` format. Min date `2021-01-01` <br> Max date range: 1 year <br> (Default - 30 days ago)'
          in: query
          name: start_date
          required: false
          schema:
            type: string
            format: date
        - description: End date for the data range. `YYYY-MM-DD` format. (Default - today)
          in: query
          name: end_date
          required: false
          schema:
            type: string
            format: date
        - description: Only use keywords tracked by current user. (Default - `false`)
          in: query
          name: user_tracked
          required: false
          schema:
            type: string
            enum:
              - true
              - false
        - description: The devices to filter by (iOS only). (Default - `iphone`)
          in: query
          name: devices
          required: false
          schema:
            type: string
            enum:
              - iphone
              - ipad
        - description: The keyword types to filter by. (Default - include all types)
          in: query
          name: keyword_types
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - branded
                - competitor
                - generic
            minItems: 0
          style: form
          explode: false
        - description: Limit of number of keywords to return (max 200).
          in: query
          name: limit
          required: false
          example: 25
          schema:
            type: integer
            format: Int64
        - description: Offset.
          in: query
          name: offset
          required: false
          schema:
            type: integer
            format: Int64
        - description: 'Array of metrics and direction to order by (`metric:direction`).'
          in: query
          name: order_by
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
          examples:
            top_by_rank:
              summary: Top keywords by rank
              value:
                - 'keyword_rank:asc'
                - 'keyword:asc'
            top_by_traffic:
              summary: Top keywords by traffic
              value:
                - 'keyword_traffic:desc'
                - 'keyword:asc'
            top_by_difficulty:
              summary: Top keywords by difficulty score
              value:
                - 'keyword_difficulty_score:desc'
                - 'keyword:asc'
            top_by_opportunity:
              summary: Top keywords by opportunity score
              value:
                - 'keyword_opportunity_score:desc'
                - 'keyword:asc'
            top_by_est_downloads:
              summary: Top keywords by estimated downloads
              value:
                - 'est_keyword_downloads:desc'
                - 'keyword:asc'
            top_by_app_count:
              summary: Top keywords by app count
              value:
                - 'keyword_app_count:desc'
                - 'keyword:asc'
            top_by_density:
              summary: Top keywords by density
              value:
                - 'keyword_density:desc'
                - 'keyword:asc'
            top_by_rank_traffic:
              summary: Top keywords by rank and traffic
              value:
                - 'keyword_rank:asc'
                - 'keyword_traffic:desc'
                - 'keyword:asc'
      responses:
        '200':
          description: <strong>Success.</strong>
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        keyword:
                          type: string
                          description: Keyword
                          example: facebook
                        keyword_rank:
                          type: number
                          description: Keyword Rank
                          example: 1
                      additionalProperties: true
                required:
                  - data
              examples:
                top_keywords_example:
                  summary: Top Keywords by Rank for Facebook (284882215)
                  value:
                    data:
                      - keyword: facebook
                        keyword_rank: 1
                      - keyword: oculus
                        keyword_rank: 2
                      - keyword: meta quest
                        keyword_rank: 3
        '401':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/401'
        '403':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/403'
        '422':
          $ref: '#/paths/~1v1~1ios~1featured~1apps/get/responses/422'
